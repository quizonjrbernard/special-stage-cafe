<section class="mx-auto max-w-4xl">
  <h1 class="text-3xl font-semibold mb-6">Your Cart</h1>

  <div *ngIf="cart.items().length === 0" class="rounded-2xl bg-white p-8 text-center shadow">
    <p class="text-slate-600">Your cart is empty. Browse the <a routerLink="/menu" class="font-semibold text-slate-950 underline">menu</a> to add items.</p>
  </div>

  <div *ngIf="cart.items().length > 0" class="space-y-4">
    <div *ngFor="let it of cart.items()" class="rounded-xl bg-white p-4 flex items-center justify-between">
      <div>
        <h3 class="font-semibold">{{ it.title }}</h3>
        <p class="text-sm text-slate-600">{{ it.description }}</p>
      </div>
      <div class="text-right">
        <div class="text-sm text-slate-600">Qty: {{ it.quantity }}</div>
        <div class="font-semibold">{{ it.price }}</div>
        <button (click)="cart.remove(it.title)" class="mt-2 text-sm text-rose-600">Remove</button>
      </div>
    </div>

    <div class="rounded-xl bg-white p-4 flex items-center justify-between">
      <div class="font-semibold">Total</div>
      <div class="font-bold">AED {{ cart.total() }}</div>
    </div>

    <div class="flex gap-3">
      <button (click)="cart.clear()" class="rounded-full border px-4 py-2">Clear</button>
      <a routerLink="/checkout" class="rounded-full bg-amber-500 px-4 py-2 text-white inline-flex items-center">Checkout</a>
    </div>
  </div>
</section>
