<section class="mx-auto max-w-2xl bg-white rounded-2xl p-8 shadow">
  <h1 class="text-2xl font-semibold mb-4">Checkout</h1>

  <div *ngIf="cart.items().length === 0" class="text-center text-slate-600">
    Your cart is empty. <a routerLink="/menu" class="text-slate-900 font-semibold underline">Browse the menu</a>
  </div>

  <div *ngIf="cart.items().length > 0">
    <div class="space-y-3 mb-4">
      <div *ngFor="let it of cart.items()" class="flex justify-between">
        <div>
          <div class="font-semibold">{{ it.title }}</div>
          <div class="text-sm text-slate-600">{{ it.quantity }} × {{ it.price }}</div>
        </div>
        <div class="font-semibold">{{ it.price }}</div>
      </div>
    </div>

    <div class="flex justify-between font-bold mb-6">Total <div>AED {{ cart.total() }}</div></div>

    <div class="space-y-4">
      <input placeholder="Full name" [(ngModel)]="name" class="w-full rounded-3xl border px-4 py-3" />
      <input placeholder="Email" [(ngModel)]="email" class="w-full rounded-3xl border px-4 py-3" />
      <textarea placeholder="Order notes (optional)" [(ngModel)]="note" class="w-full rounded-xl border px-4 py-3"></textarea>
    </div>

    <div class="mt-6 flex gap-3">
      <button (click)="placeOrder()" [disabled]="placing()" class="rounded-full bg-amber-500 px-6 py-3 text-white">Place Order</button>
      <button (click)="cart.clear()" class="rounded-full border px-6 py-3">Cancel</button>
    </div>
  </div>
</section>
