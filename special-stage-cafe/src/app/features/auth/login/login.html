<section class="mx-auto max-w-xl rounded-[2rem] bg-white p-8 shadow-2xl">
	<h1 class="text-3xl font-semibold text-slate-950">Member Login</h1>
	<p class="mt-2 text-slate-600">Access the full menu, save favorites, and book events.</p>

	<form class="mt-8 space-y-6" (ngSubmit)="submit()">
		<div class="space-y-2">
			<label class="block text-sm font-medium text-slate-700">Email</label>
			<input type="email" required [(ngModel)]="email" name="email" class="w-full rounded-3xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:outline-none" />
		</div>

		<div class="space-y-2">
			<label class="block text-sm font-medium text-slate-700">Password</label>
			<input type="password" required [(ngModel)]="password" name="password" class="w-full rounded-3xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:outline-none" />
		</div>

		<div *ngIf="error()" class="rounded-3xl bg-rose-100 px-4 py-3 text-sm text-rose-700">{{ error() }}</div>

		<button type="submit" class="w-full rounded-full bg-slate-950 px-4 py-3 text-white transition hover:bg-slate-800">Sign In</button>
	</form>

	<p class="mt-6 text-center text-sm text-slate-600">New to Special Stage Cafe? <a routerLink="/register" class="font-semibold text-slate-950 underline">Register now</a>.</p>
</section>
