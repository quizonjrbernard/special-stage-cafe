<section class="mx-auto max-w-xl rounded-[2rem] bg-white p-8 shadow-2xl">
	<h1 class="text-3xl font-semibold text-slate-950">Create Your Account</h1>
	<p class="mt-2 text-slate-600">Join Special Stage Cafe and unlock access to our full coffee menu.</p>

	<form class="mt-8 space-y-6" (ngSubmit)="submit()">
		<div class="space-y-2">
			<label class="block text-sm font-medium text-slate-700">Name</label>
			<input required [(ngModel)]="name" name="name" class="w-full rounded-3xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:outline-none" />
		</div>

		<div class="space-y-2">
			<label class="block text-sm font-medium text-slate-700">Email</label>
			<input type="email" required [(ngModel)]="email" name="email" class="w-full rounded-3xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:outline-none" />
		</div>

		<div class="space-y-2">
			<label class="block text-sm font-medium text-slate-700">Password</label>
			<input type="password" required [(ngModel)]="password" name="password" class="w-full rounded-3xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:outline-none" />
		</div>

		<div *ngIf="error()" class="rounded-3xl bg-rose-100 px-4 py-3 text-sm text-rose-700">{{ error() }}</div>
		<div *ngIf="success()" class="rounded-3xl bg-emerald-100 px-4 py-3 text-sm text-emerald-700">{{ success() }}</div>

		<button type="submit" class="w-full rounded-full bg-slate-950 px-4 py-3 text-white transition hover:bg-slate-800">Register</button>
	</form>

	<p class="mt-6 text-center text-sm text-slate-600">Already registered? <a routerLink="/login" class="font-semibold text-slate-950 underline">Login here</a>.</p>
</section>
